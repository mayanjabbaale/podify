# Local development services for Podify.
#
# Redis is the Celery broker + result backend (required).
# Postgres is OPTIONAL — the app defaults to SQLite to match the 8GB-RAM
# hardware target. Set DATABASE_URL=postgresql+psycopg://podify:podify@localhost:5432/podify
# in .env to use Postgres instead.

services:
  redis:
    image: redis:7.4-alpine
    container_name: podify-redis
    # Bind 6379 to the loopback interface only — the app, Celery worker,
    # and any redis-cli on the Windows host connect via localhost. Don't
    # change to "0.0.0.0" or remove the host IP; that would expose Redis
    # to the LAN with no auth.
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:16-alpine
    container_name: podify-postgres
    environment:
      POSTGRES_USER: podify
      POSTGRES_PASSWORD: podify
      POSTGRES_DB: podify
    # Same loopback-only treatment as Redis. Switch to Postgres by setting
    # DATABASE_URL=postgresql+psycopg://podify:podify@localhost:5432/podify
    # in .env (see README).
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U podify -d podify"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  redis_data:
  postgres_data:
