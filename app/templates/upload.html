{% extends "base.html" %}

{% block title %}Upload · Podify{% endblock %}

{% block content %}
<div class="space-y-6">
    <header>
        <h1 class="text-3xl font-bold tracking-tight">Upload a PDF</h1>
        <p class="text-slate-600 mt-2">
            Drop a PDF here or pick one from your computer. Podify extracts
            the text, detects chapter boundaries, and shows the list below
            ready for podcast or audiobook generation.
        </p>
    </header>

    <div class="bg-white rounded-lg border border-dashed border-slate-300 p-10 text-center">
        <form
            id="upload-form"
            action="/api/books"
            method="post"
            enctype="multipart/form-data"
            class="space-y-4"
        >
            <label class="block">
                <span class="sr-only">Choose PDF</span>
                <input
                    id="pdf-input"
                    type="file"
                    name="file"
                    accept="application/pdf"
                    required
                    class="block w-full text-sm text-slate-500
                           file:mr-4 file:py-2 file:px-4
                           file:rounded file:border-0
                           file:text-sm file:font-semibold
                           file:bg-slate-100 file:text-slate-700
                           hover:file:bg-slate-200"
                >
            </label>
            <button
                type="submit"
                class="inline-flex items-center px-4 py-2 rounded bg-slate-900 text-white text-sm font-semibold hover:bg-slate-700 disabled:opacity-50"
            >
                Upload and extract
            </button>
        </form>

        <div id="upload-status" class="hidden mt-6 text-sm" aria-live="polite"></div>
    </div>
</div>

<script>
(function () {
    const form = document.getElementById("upload-form");
    const statusEl = document.getElementById("upload-status");
    const button = form.querySelector("button[type=submit]");

    form.addEventListener("submit", async function (event) {
        event.preventDefault();
        const fileInput = document.getElementById("pdf-input");
        if (!fileInput.files || !fileInput.files[0]) {
            return;
        }
        const formData = new FormData();
        formData.append("file", fileInput.files[0]);

        button.disabled = true;
        statusEl.classList.remove("hidden");
        statusEl.textContent = "Uploading…";

        try {
            const res = await fetch("/api/books", {
                method: "POST",
                body: formData,
            });
            if (!res.ok) {
                const detail = (await res.json().catch(() => ({}))).detail || res.statusText;
                throw new Error(detail);
            }
            const body = await res.json();
            window.location.href = body.detail_url;
        } catch (err) {
            statusEl.textContent = "Upload failed: " + err.message;
            button.disabled = false;
        }
    });
})();
</script>
{% endblock %}
